apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prod-app
  template:
    metadata:
      labels:
        app: prod-app
    spec:
      containers:
        - name: prod-node
          image: vamckrish08/kubernetes:1
---
apiVersion: v1
kind: Service
metadata:
  name: prod-service
spec:
  selector:
    app: prod-app
  ports:
    - protocol: 'TCP'
      port: 80
      targetPort: 8080
  type: NodePort