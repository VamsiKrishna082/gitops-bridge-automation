apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-app-private-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secrets
  data:
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: github_app_private_key
  target:
    template:
      engineVersion: v2
      data:
        secret: "{{.githubAppPrivateKey}}"
        