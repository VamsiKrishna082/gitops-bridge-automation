apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-host-name
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secrets
  data:
    - secretKey: argocdHostName
      remoteRef:
        key: argocd_host_name
  target:
    template:
      engineVersion: v2
      data:
        hostname: "{{.argocdHostName}}"
        