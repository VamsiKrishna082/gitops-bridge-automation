apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-client-id
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secrets
  data:
    - secretKey: backstageClientId
      remoteRef:
        key: vamsi-krishna-sandbox-oauth-client-id
  target:
    template:
      engineVersion: v2
      data:
        id: "{{.backstageClientId}}"
        