apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-backend-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secrets
  data:
    - secretKey: backstageBackendAuth
      remoteRef:
        key: vamsi-krishna-sandbox-backstage-auth
  target:
    template:
      engineVersion: v2
      data:
        password: "{{.backstageBackendAuth}}"
        