apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: grafana-appset
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: false
  ignoreApplicationDifferences:
    - jsonPointers:
      - /spec/syncPolicy/automated
      - /spec/source/targetRevision
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                workloadChart: grafana
                workloadChartVersion: 9.0.0
                workloadChartRepository: https://grafana.github.io/helm-charts
              selector:
                matchExpressions:
                  - key: cluster_name
                    operator: NotIn
                    values: [gitops-bridge-spoke-cluster]
          - clusters:
              selector:
                matchLabels:
                  environment: production
              values:
                workloadChartVersion: 9.0.0
  template:
    metadata:
      name: '{{.values.workloadChart}}-{{.name}}'
    spec:
      project: default
      sources:
      # Load ref for values files
      - repoURL: '{{.metadata.annotations.addons_repo_url}}'
        targetRevision: '{{.metadata.annotations.addons_repo_revision}}'
        ref: values
      # Kustomize for ExternalSecrets
      - repoURL: '{{.metadata.annotations.addons_repo_url}}'
        targetRevision: '{{.metadata.annotations.addons_repo_revision}}'
        path: '{{.metadata.annotations.addons_repo_basepath}}environments/default/workloads/{{.values.workloadChart}}/'
      # Helm install
      - chart: '{{.values.workloadChart}}'
        repoURL: '{{.values.workloadChartRepository}}'
        targetRevision: '{{.values.workloadChartVersion}}'
        helm:
          releaseName: '{{.values.workloadChart}}'
          ignoreMissingValueFiles: true
          valueFiles:
            - $values/environments/default/workloads/{{.values.workloadChart}}/values.yaml
            - $values/environments/{{.metadata.labels.environment}}/workloads/{{.values.workloadChart}}/values.yaml
            - $values/environments/clusters/{{.name}}/workloads/{{.values.workloadChart}}/values.yaml
          values: |
            serviceAccount:
              annotations:
                'iam.gke.io/gcp-service-account': '{{.metadata.annotations.grafana_sa}}'
      destination:
        namespace: '{{.values.workloadChart}}'
        name: '{{.name}}'
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            goldilocks.fairwinds.com/enabled: 'false'
        automated:
          prune: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        # ignore configmap differences for datasource syncer because these have to be set manually
        - kind: ConfigMap
          name: grafana-datasource-syncer
          namespace: '{{.values.workloadChart}}'
          jsonPointers:
            - /data
            - /metadata