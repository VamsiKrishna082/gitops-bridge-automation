apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
spec:
  project: default
  destination:
    namespace: kargo
    server: https://kubernetes.default.svc
  source:
    repoURL: ghcr.io/akuity/kargo-charts
    chart: kargo
    targetRevision: 1.2.0
    helm:
      parameters:
        - name: api.adminAccount.passwordHash
          value: "$$2y$$10$$zoIru1WyQeRLtEQMAjkQF.ymAabYjdprw6.bpsthHSfD6SABohDv."
        - name: api.adminAccount.tokenSigningKey
          value: "OtCHt4abutLtnBTdscvtihH4llamJP4b"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
